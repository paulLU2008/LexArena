      <stop offset="100%" style="stop-color:#1e3d1b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 海洋背景 -->
  <rect width="200" height="280" fill="url(#seaGrad)" rx="8"/>

  <!-- 台灣本島輪廓（簡化路徑，縮放至 SVG 視窗） -->
