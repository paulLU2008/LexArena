    C 62,128 66,122 68,114
    C 70,106 70,98 68,90
    C 66,82 62,76 60,68
    C 58,60 58,52 62,44
    C 66,36 72,30 78,24
    C 84,18 90,14 95,12
    Z
  " fill="url(#landGrad)" stroke="#4a7c3f" stroke-width="1.5"/>

